<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Garden 3D v2</title><link rel="stylesheet" href="css/garden3d.css"><style>body{margin:0;background:#e0e7e1;font-family:Arial,sans-serif}.demo-wrap{max-width:1440px;padding:28px;margin:auto}h1{font-size:21px;letter-spacing:-.4px;color:#294b38;margin:0 0 8px}.demo-wrap>p{font-size:12px;color:#6c8170;margin-bottom:18px}.garden3d{height:760px}.demo-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.demo-controls button{padding:9px 13px;border:1px solid #c2d3c4;background:#f9fcf8;color:#385f43;border-radius:9px;cursor:pointer}@media(max-width:650px){.demo-wrap{padding:12px}.garden3d{height:700px}}
</style><div class="demo-wrap"><h1>Smart Garden · Interactive 3D</h1><p>DEMO: dữ liệu mẫu để xem thử mô hình, không điều khiển phần cứng.</p><div id="garden3d" class="garden3d" aria-label="Interactive smart garden 3D model">
                <div class="garden3d-toolbar">
                    <span class="garden3d-eyebrow">SMART GARDEN / DIGITAL TWIN</span>
                    <div><button type="button" data-garden="rotate" aria-pressed="false">Auto rotate</button><button type="button" data-garden="reset">Reset view</button><button type="button" data-garden="labels" aria-pressed="true">Labels</button></div>
                </div>
                <div class="garden3d-stage" tabindex="0" aria-label="Drag to rotate, scroll to zoom. Arrow keys rotate; plus and minus zoom."></div>
                <div class="garden3d-footer"><span>Drag to orbit · Scroll / pinch to zoom</span><span class="garden3d-status" role="status">Waiting for sensor data</span></div>
            </div>
            <div class="demo-controls"><button id="demo-mist">Bật / tắt sương</button><button id="demo-water">Đổi mực nước</button><button id="demo-rain">Đổi trạng thái mưa</button></div></div><script>const AppState={hardwareConnected:false,isPumpActive:true,telemetry:{soilMoisture:45,tankLevel:72,isRaining:false,airTemperature:28,lastRxTime:Date.now()}};setInterval(()=>AppState.telemetry.lastRxTime=Date.now(),1000);document.getElementById('demo-mist').onclick=()=>AppState.isPumpActive=!AppState.isPumpActive;document.getElementById('demo-water').onclick=()=>AppState.telemetry.tankLevel=AppState.telemetry.tankLevel>50?18:85;document.getElementById('demo-rain').onclick=()=>AppState.telemetry.isRaining=!AppState.telemetry.isRaining;
</script><script src="js/vendor/three.min.js">
</script><script src="js/garden3d.js">
</script></html>
