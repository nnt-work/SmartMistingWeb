# Copy this file to prj_sm_config.properties and adjust settings for your environment.

# Database Configuration (Microsoft SQL Server)
db.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=MistingDB;encrypt=false;trustServerCertificate=true;loginTimeout=3;socketTimeout=5000
db.user=sa
db.password=YOUR_DB_PASSWORD

# External Alerts & Monitoring (Optional)
# Paste your Discord Webhook URL below to receive rich embed telemetry alerts
discord.webhook.url=https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN

# Healthchecks.io Ping URL for heartbeat monitoring
hc.ping.url=https://hc-ping.com/YOUR-UUID

# Telemetry Alert Thresholds
alert.demo=true
alert.temp.max=29
alert.soil.min=40
alert.soil.max=65
alert.rh.min=60
